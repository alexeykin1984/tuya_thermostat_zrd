name: Build firmware

on:
  push:
    branches: [r01-calibration-30]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Telink tc32 toolchain
        id: tc32
        uses: actions/cache@v4
        with:
          path: /opt/tc32
          key: tc32-gcc-v2.0

      - name: Install Telink tc32 toolchain
        if: steps.tc32.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o tc32.tar.bz2 https://shyboy.oss-cn-shenzhen.aliyuncs.com/readonly/tc32_gcc_v2.0.tar.bz2
          echo "33b854be3e3db3dba4b4dacdda2cd4ea1c94dfd4d562864a095956de7991b430  tc32.tar.bz2" | sha256sum -c
          sudo tar -xjf tc32.tar.bz2 -C /opt

      - name: Build
        run: |
          # upstream builds on Windows; the folder is "bootLoader" but makefiles use "bootloader"
          [ -e src/bootloader ] || ln -s bootLoader src/bootloader
          make clean
          make bootloader -f makefile.bootloader
          make clean
          make -f makefile

      - name: Version
        id: ver
        run: |
          f=$(ls bin/tuya_thermostat_zrd_V*.bin)
          v=$(basename "$f" .bin | sed 's/tuya_thermostat_zrd_//')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.ver.outputs.version }}
          path: |
            bin/*.zigbee
            bin/tuya_thermostat_zrd_V*.bin

      - name: Make z2m OTA index
        run: |
          tag="${{ steps.ver.outputs.version }}-r01cal"
          python3 - "$tag" <<'EOF'
          import glob, hashlib, json, os, struct, sys
          tag = sys.argv[1]
          f = glob.glob("bin/6565-*.zigbee")[0]
          data = open(f, "rb").read()
          manuf, itype, ver = struct.unpack_from("<HHI", data, 10)
          header = data[20:52].split(b"\0")[0].decode(errors="ignore")
          name = os.path.basename(f)
          index = [{
              "fileName": name,
              "fileVersion": ver,
              "fileSize": len(data),
              # raw.githubusercontent.com: github.com does not resolve inside the z2m container
              "url": f"https://raw.githubusercontent.com/${{ github.repository }}/ota/{name}",
              "imageType": itype,
              "manufacturerCode": manuf,
              "sha512": hashlib.sha512(data).hexdigest(),
              "otaHeaderString": header,
              "modelId": "Tuya_Thermostat_r01",
          }]
          json.dump(index, open("bin/index.json", "w"), indent=2)
          print(json.dumps(index, indent=2))
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.version }}-r01cal"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
              --notes "Build of ${GITHUB_SHA::7}: r01 calibration -30..+30 (z2m shows -3.0 for -30)."
          gh release upload "$tag" bin/*.zigbee bin/tuya_thermostat_zrd_V*.bin bin/index.json --clobber
          gh release edit "$tag" --latest

      - name: Publish to ota branch (z2m index + image)
        run: |
          mkdir ota && cp bin/index.json bin/6565-*.zigbee ota/
          cd ota
          git init -q -b ota
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "OTA ${{ steps.ver.outputs.version }} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ota
